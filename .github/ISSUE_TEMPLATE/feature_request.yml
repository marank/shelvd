name: Feature request
description: An idea for shelvd.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem would it solve?
      description: Describe the situation and what is missing, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
