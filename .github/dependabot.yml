# Weekly dependency updates, minor and patch versions in one pull request per area;
# majors one by one. Every ecosystem waits 7 days after a release (cooldown) before
# proposing it: a hijacked release is usually found and pulled within days. Security
# updates are not delayed. Pinned digests (Dockerfile) and commit SHAs (workflows) are updated
# together with their tag. Not covered (bump by hand, see AGENTS.md): the images started
# with `docker run` in build.yaml (TRIVY_IMAGE, POSTGRES_IMAGE), the tool versions in the
# justfile (actionlint, zizmor) and the workflows (just), .pre-commit-config.yaml, and
# pnpm's packageManager field if Dependabot leaves it alone.
#
# Commit titles: `deps:` for what reaches the image or the operators (backend and frontend
# runtime packages, base images, compose), `chore(deps):` for development tools, docs and
# workflows. With release-please, `deps:` triggers a patch release and is listed under
# "Dependencies"; `chore(deps):` stays out of the changelog.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # Follows the Node major of the images (node:26 in the Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # Node: only even majors (LTS lines). Python minors need a look at requires-python
      # and wheel support; they still come, as single PRs.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore of the data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: [minor, patch]
