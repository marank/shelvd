; supervisord runs as PID 1 and keeps gunicorn and nginx running. Everything runs as the
; unprivileged "app" user (see Dockerfile); runtime files live in /tmp.
; If a program keeps failing, exit-on-fatal stops supervisord and with it the container,
; so Docker's restart policy can take over.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; For `supervisorctl status` inside the container. supervisord logs a CRIT notice that it
; has no password; only "app" may open the socket (chmod 0700), which is enough here.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:gunicorn]
; Deploy checks, migrations and the first admin are brought up to date right before the
; server starts. Workers: GUNICORN_WORKERS, default 3. The access log takes the
; client address from X-Real-IP, which nginx sets after evaluating TRUSTED_PROXIES.
command=/bin/sh -c 'python manage.py check --deploy --fail-level ERROR && python manage.py migrate --noinput && python manage.py ensure_admin && exec gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers ${GUNICORN_WORKERS:-3} --worker-tmp-dir /tmp --access-logfile - --access-logformat "%%({x-real-ip}i)s %%(t)s \"%%(r)s\" %%(s)s %%(b)s %%(L)ss" --forwarded-allow-ips 127.0.0.1'
directory=/app
priority=10
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
; Periodic jobs of the integrations (e.g. refreshing HowLongToBeat data): checks every
; minute what is due; admins set intervals in the app. A database that isn't ready yet
; (migrations still running) is just retried next round. Exits cleanly on TERM.
command=python manage.py run_scheduler
directory=/app
priority=30
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx
priority=20
startsecs=2
startretries=3
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:exit-on-fatal]
command=python3 /usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
