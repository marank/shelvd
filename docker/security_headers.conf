# Security headers for everything nginx serves itself (SPA, assets, static files).
# Included in each location, because add_header in a location drops inherited ones.
# Django sets its own headers (incl. CSP) for /api and /admin.
#
# CSP: scripts only from our origin. style-src needs 'unsafe-inline' because component
# libraries (Reka UI/shadcn) set style attributes; tighten it if the app doesn't need it.
# 'wasm-unsafe-eval': the barcode scanner's (self-hosted) WebAssembly decoder.
# images.igdb.com: cover thumbnails of search results before a game is imported
# (imported covers are stored locally under /media/).
# camera=(self): barcode scanning with the device camera.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.igdb.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
