# Local Postgres for native development only (VS Code task "db: start dev postgres"). The app itself runs
# natively; point it here with DB_TYPE=postgres and DB_HOST=localhost in .env.
name: shelvd-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql

volumes:
  db-dev-data:
